[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
[project]
name = "ll144-bias-audit-mcp"
version = "0.1.0"
description = "NYC Local Law 144 AEDT bias audit — selection rate, impact ratio (4/5ths), public summary — governed + signed. CSOAI Layer-0."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
dependencies = ["mcp>=2.0.0", "pydantic>=2.0"]
[project.scripts]
ll144-bias-audit-mcp = "server:main"
[tool.setuptools]
py-modules = ["server", "mcp2026_shim"]
